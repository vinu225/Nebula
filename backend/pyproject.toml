[project]
name = "sovereign-ai-workbench"
version = "0.1.0"
description = "Sovereign On-Premise Agentic AI Workbench for Confidential Industrial Work (SIH26117)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SIH26117 Team" }]

dependencies = [
    # --- Core API ---
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    # --- LLM / Agent ---
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    # --- Object Storage ---
    "minio>=7.2.0",
    # --- Document Processing ---
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    # --- OCR ---
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "Pillow>=10.4.0",
    # --- MCP ---
    "mcp[cli]>=1.0.0",
    # --- Docker ---
    "docker>=7.1.0",
    # --- Logging ---
    "structlog>=24.4.0",
    # --- Utilities ---
    "uuid7>=0.1.0",
    "psutil>=7.2.2",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
